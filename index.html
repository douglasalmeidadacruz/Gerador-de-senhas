
<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Senhas</title>

    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Gerador de Senhas</h1>

        <p>Crie sua senha personalizada!</p>

        <label for="senha">Senha gerada:</label>

        <div class="campo-senha">
            <input type="password" id="senha" readonly>

            <button onclick="mostrarSenha()">Mostrar</button>
        </div>

        <label for="tamanho">Tamanho da senha:</label>

        <input type="number" id="tamanho" value="12" min="1" max="128">

        <h3>Escolha os caracteres:</h3>

        <div class="opcoes">

            <label>
                <input type="checkbox" id="maiusculas" checked>
                Letras maiúsculas (ABC)
            </label>

            <label>
                <input type="checkbox" id="minusculas" checked>
                Letras minúsculas (abc)
            </label>

            <label>
                <input type="checkbox" id="numeros" checked>
                Números (123)
            </label>

            <label>
                <input type="checkbox" id="especiais">
                Caracteres especiais (@#$)
            </label>

        </div>

        <button onclick="gerarSenha()" class="btn-gerar">
            Gerar senha
        </button>

        <button onclick="limparSenha()" class="btn-limpar">
            Limpar senha
        </button>

        <p id="mensagem"></p>

    </div>

    <script src="script.js"></script>

</body>
</html>
